# Builds and publishes a release when a tag V<version> is pushed.
# releaser.py's "Prepare and tag" makes that tag; this does the rest.
# aidocks/project_release_workflow_plan.md has the plan.
name: Release

on:
  push:
    tags: ['V*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # let every system finish, so a re-run of the one that failed is all a bad build needs
      fail-fast: false
      matrix:
        include:
          - {key: windows, name: Windows, os: windows-latest, python: '3.12'}
          - {key: linux, name: Linux, os: ubuntu-latest, python: '3.12'}
          # the runner names for the Macs are to be checked on the first run (2026-10-05)
          - {key: macos-arm64, name: macOS Apple Silicon, os: macos-15, python: '3.13'}
          - {key: macos-x86_64, name: macOS Intel, os: macos-15-intel, python: '3.13'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install what the game and the build need
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build and pack
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: python releaser.py --ci-build "$TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.key }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    # every build must have worked: one that failed publishes nothing
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: archives
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python releaser.py --ci-release "$TAG" archives
